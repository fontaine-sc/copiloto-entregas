<!DOCTYPE html>
<html lang="pt-BR" translate="no">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">

<title>Copiloto Entregas V3.1</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#ff6a00;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.stat{
background:#fff3eb;
padding:12px;
border-radius:12px;
text-align:center;
}

input[type=file]{
width:100%;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.importar{
background:#ff6a00;
color:white;
}

.waze{
background:#00b7ff;
color:white;
}

.toggle{
background:#e9e9e9;
color:#333;
}

.grupo{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 1px 6px rgba(0,0,0,.08);
border-left:6px solid #ff6a00;
}

.endereco{
margin-top:8px;
font-size:15px;
line-height:1.4;
}

.badge{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border-radius:8px;
background:#fff3cd;
font-weight:bold;
}

.pacotes{
display:none;
margin-top:10px;
}

.pacote{
padding:10px;
border-top:1px solid #eee;
}

.codigo{
font-weight:bold;
word-break:break-word;
}

.detalhe{
font-size:14px;
color:#555;
margin-top:4px;
}

</style>

</head>

<body translate="no">

<header>
🚚 Copiloto Entregas
</header>

<div class="container">

<div class="card">

<h2>Importar Rota Shopee</h2>

<input
type="file"
id="arquivo"
accept=".xlsx,.xls">

<button
class="importar"
onclick="importarExcel()">
Importar Rota
</button>

<div class="stats">

<div class="stat">
<div>Pacotes</div>
<h2 id="pacotes">0</h2>
</div>

<div class="stat">
<div>Paradas</div>
<h2 id="locais">0</h2>
</div>

</div>

</div>

<div id="lista"></div>

</div>

<script>

function importarExcel(){

const arquivo =
document.getElementById("arquivo").files[0];

  
if(!arquivo){

alert("Selecione a planilha");
return;

}

const reader = new FileReader();

reader.onload = function(e){

const data =
new Uint8Array(e.target.result);

const workbook =
XLSX.read(data,{type:'array'});

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const json =
XLSX.utils.sheet_to_json(sheet);

mostrarEntregas(json);

};
reader.readAsArrayBuffer(arquivo);

}

function mostrarEntregas(dados){

document.getElementById("pacotes").innerText =
dados.length;

const grupos = {};

/*
  Regra de agrupamento:
  - Stops como 1, 1A e 1B ficam juntos SOMENTE quando
    possuem o mesmo endereço/coordenadas.
  - Stops diferentes continuam separados quando o endereço
    ou as coordenadas forem diferentes.
  - Linhas sem Stop são Extras e são agrupadas pelo endereço/
    coordenadas.
*/

dados.forEach(item=>{

const endereco =
item["Destination Address"] ||
item["Address"] ||
"-";

const codigo =
item["SPX TN"] ||
item["SPX_TN"] ||
"-";

const lat =
item["Latitude"] ||
"";

const lng =
item["Longitude"] ||
"";

const stopOriginal =
item["Stop"] ||
item["stop"] ||
"";

const stopTexto = String(stopOriginal).trim();

/* Remove somente a letra final do Stop para obter a parada-base.
   Ex.: 1A -> 1, 1B -> 1, 12A -> 12. */
const paradaBase = stopTexto
.replace(/[A-Za-z]$/,"")
.trim();

/*
  Coordenadas são a melhor identificação de local quando existem.
  Quando não existem, usamos o endereço.
*/
const localChave = (lat && lng)
? String(lat).trim() + "|" + String(lng).trim()
: String(endereco).trim().toLowerCase();

/*
  Stops com a mesma parada-base só podem ser unidos quando
  representam o mesmo local.
*/
const chave = stopTexto
? "STOP|" + paradaBase + "|" + localChave
: "EXTRA|" + localChave;

if(!grupos[chave]){

grupos[chave] = {
endereco:endereco,
lat:lat,
lng:lng,
stop:paradaBase,
pacotes:[]
};

}

grupos[chave].pacotes.push({

codigo:codigo,
endereco:endereco,
stop:stopTexto

});

});


const lista =
document.getElementById("lista");

lista.innerHTML = "";

const locais =
Object.values(grupos);

document.getElementById("locais")
.innerText = locais.length;


locais.forEach((grupo,index)=>{

let htmlPacotes = "";

grupo.pacotes.forEach(pacote=>{

htmlPacotes += `

<div class="pacote">

<div class="codigo">
${pacote.codigo}
</div>

<div class="detalhe">
${pacote.endereco}
</div>

</div>

`;

});


lista.innerHTML += `

<div class="grupo">

<h3>
${grupo.stop ? "📍 Parada " + grupo.stop : "⭐ Extra"}
</h3>

<div class="endereco">
${grupo.endereco}
</div>

<div class="badge">
${grupo.pacotes.length}
pacote(s) neste local
</div>

<button
class="toggle"
onclick="alternarPacotes(${index})">
Mostrar pacotes
</button>

<div
id="pacotes_${index}"
class="pacotes">

${htmlPacotes}

</div>

<button
class="waze"
onclick="
abrirWaze(
'${grupo.lat}',
'${grupo.lng}'
)">
Abrir no Waze</button>

</div>

`;

});

}
function alternarPacotes(index){

const elemento =
document.getElementById(
"pacotes_" + index
);

if(
elemento.style.display ===
"block"
){

elemento.style.display =
"none";

}else{

elemento.style.display =
"block";

}

}

function abrirWaze(lat,lng){

if(!lat || !lng){

alert(
"Latitude ou Longitude não encontrada."
);

return;

}

window.open(
`https://waze.com/ul?ll=${lat},${lng}&navigate=yes`,
'_blank'
);

}

</script>
  
</body>

</html>
